<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,400..700;1,8..30,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body>

      <span class="hero-eyebrow">2010 — agora</span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
